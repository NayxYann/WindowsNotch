name: Build Windows preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: npm install
      - name: Generate Windows icon
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $source = @"
          using System;
          using System.Drawing;
          using System.Drawing.Drawing2D;
          using System.Runtime.InteropServices;

          public static class WindowsNotchIcon {
            [DllImport("user32.dll", CharSet = CharSet.Auto)]
            private static extern bool DestroyIcon(IntPtr handle);

            public static void Create(string path) {
              using (var bitmap = new Bitmap(64, 64))
              using (var graphics = Graphics.FromImage(bitmap)) {
                graphics.SmoothingMode = SmoothingMode.AntiAlias;
                graphics.Clear(Color.Transparent);
                using (var background = new GraphicsPath()) {
                  background.AddArc(4, 5, 20, 20, 180, 90);
                  background.AddArc(40, 5, 20, 20, 270, 90);
                  background.AddArc(40, 39, 20, 20, 0, 90);
                  background.AddArc(4, 39, 20, 20, 90, 90);
                  background.CloseFigure();
                  using (var brush = new SolidBrush(Color.FromArgb(255, 18, 20, 29)))
                    graphics.FillPath(brush, background);
                }
                using (var accent = new SolidBrush(Color.FromArgb(255, 91, 124, 250)))
                  GraphicsExtensions.FillRoundedRectangle(graphics, accent, new Rectangle(19, 5, 26, 20), 9);
                using (var pen = new Pen(Color.FromArgb(255, 225, 229, 242), 3))
                  graphics.DrawLine(pen, 22, 39, 42, 39);
                IntPtr handle = bitmap.GetHicon();
                try {
                  using (var icon = Icon.FromHandle(handle))
                  using (var stream = System.IO.File.Create(path))
                    icon.Save(stream);
                } finally {
                  DestroyIcon(handle);
                }
              }
            }
          }

          public static class GraphicsExtensions {
            public static void FillRoundedRectangle(Graphics graphics, Brush brush, Rectangle bounds, int radius) {
              using (var path = new GraphicsPath()) {
                int diameter = radius * 2;
                path.AddArc(bounds.X, bounds.Y, diameter, diameter, 180, 90);
                path.AddArc(bounds.Right - diameter, bounds.Y, diameter, diameter, 270, 90);
                path.AddArc(bounds.Right - diameter, bounds.Bottom - diameter, diameter, diameter, 0, 90);
                path.AddArc(bounds.X, bounds.Bottom - diameter, diameter, diameter, 90, 90);
                path.CloseFigure();
                graphics.FillPath(brush, path);
              }
            }
          }
          "@
          Add-Type -TypeDefinition $source -ReferencedAssemblies ([System.Drawing.Bitmap].Assembly.Location)
          New-Item -ItemType Directory -Force src-tauri/icons | Out-Null
          [WindowsNotchIcon]::Create((Join-Path (Get-Location) "src-tauri/icons/icon.ico"))
      - name: Build Windows installer
        run: npx tauri build --bundles nsis
      - name: Upload installer
        uses: actions/upload-artifact@v6
        with:
          name: WindowsNotch-preview
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
