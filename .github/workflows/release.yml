name: Publier une version Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier, par exemple 0.1.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      - name: Generate Windows icon
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $source = @"
          using System;
          using System.Drawing;
          using System.Drawing.Drawing2D;
          using System.Runtime.InteropServices;

          public static class WindowsNotchIcon {
            [DllImport("user32.dll", CharSet = CharSet.Auto)]
            private static extern bool DestroyIcon(IntPtr handle);

            public static void Create(string path) {
              using (var bitmap = new Bitmap(64, 64))
              using (var graphics = Graphics.FromImage(bitmap)) {
                graphics.SmoothingMode = SmoothingMode.AntiAlias;
                graphics.Clear(Color.Transparent);
                using (var background = new GraphicsPath()) {
                  background.AddArc(4, 5, 20, 20, 180, 90);
                  background.AddArc(40, 5, 20, 20, 270, 90);
                  background.AddArc(40, 39, 20, 20, 0, 90);
                  background.AddArc(4, 39, 20, 20, 90, 90);
                  background.CloseFigure();
                  using (var brush = new SolidBrush(Color.FromArgb(255, 18, 20, 29)))
                    graphics.FillPath(brush, background);
                }
                using (var accent = new SolidBrush(Color.FromArgb(255, 91, 124, 250)))
                  GraphicsExtensions.FillRoundedRectangle(graphics, accent, new Rectangle(19, 5, 26, 20), 9);
                using (var pen = new Pen(Color.FromArgb(255, 225, 229, 242), 3))
                  graphics.DrawLine(pen, 22, 39, 42, 39);
                IntPtr handle = bitmap.GetHicon();
                try {
                  using (var icon = Icon.FromHandle(handle))
                  using (var stream = System.IO.File.Create(path))
                    icon.Save(stream);
                } finally {
                  DestroyIcon(handle);
                }
              }
            }
          }

          public static class GraphicsExtensions {
            public static void FillRoundedRectangle(Graphics graphics, Brush brush, Rectangle bounds, int radius) {
              using (var path = new GraphicsPath()) {
                int diameter = radius * 2;
                path.AddArc(bounds.X, bounds.Y, diameter, diameter, 180, 90);
                path.AddArc(bounds.Right - diameter, bounds.Y, diameter, diameter, 270, 90);
                path.AddArc(bounds.Right - diameter, bounds.Bottom - diameter, diameter, diameter, 0, 90);
                path.AddArc(bounds.X, bounds.Bottom - diameter, diameter, diameter, 90, 90);
                path.CloseFigure();
                graphics.FillPath(brush, path);
              }
            }
          }
          "@
          Add-Type -TypeDefinition $source -ReferencedAssemblies @([System.Drawing.Bitmap].Assembly.Location, [System.Drawing.Rectangle].Assembly.Location)
          New-Item -ItemType Directory -Force src-tauri/icons | Out-Null
          [WindowsNotchIcon]::Create((Join-Path (Get-Location) "src-tauri/icons/icon.ico"))

      - name: Configure version and updater key
        shell: pwsh
        env:
          APP_VERSION: ${{ inputs.version }}
          UPDATE_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
        run: |
          if ($env:APP_VERSION -notmatch '^\d+\.\d+\.\d+([+-][0-9A-Za-z.-]+)?$') {
            throw "La version doit suivre le format SemVer, par exemple 0.1.1."
          }
          if ([string]::IsNullOrWhiteSpace($env:UPDATE_PUBLIC_KEY)) {
            throw "Il manque la variable de dépôt TAURI_SIGNING_PUBLIC_KEY."
          }
          $configPath = "src-tauri/tauri.conf.json"
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          $config.version = $env:APP_VERSION
          $config.bundle.createUpdaterArtifacts = $true
          $config.plugins.updater.pubkey = $env:UPDATE_PUBLIC_KEY
          $config | ConvertTo-Json -Depth 100 | Set-Content -Path $configPath -Encoding utf8

      - name: Build and publish signed release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ inputs.version }}
          releaseName: WindowsNotch v${{ inputs.version }}
          releaseBody: "Version ${{ inputs.version }} de WindowsNotch."
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          args: --bundles nsis
