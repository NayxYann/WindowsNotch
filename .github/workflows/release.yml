name: Publier une version Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier, par exemple 0.1.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      - name: Generate Windows icon
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          New-Item -ItemType Directory -Force src-tauri/icons | Out-Null
          $bitmap = [System.Drawing.Bitmap]::new(64, 64)
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::AntiAlias
          $graphics.Clear([System.Drawing.Color]::Transparent)
          $background = [System.Drawing.Drawing2D.GraphicsPath]::new()
          $background.AddArc(4, 5, 20, 20, 180, 90)
          $background.AddArc(40, 5, 20, 20, 270, 90)
          $background.AddArc(40, 39, 20, 20, 0, 90)
          $background.AddArc(4, 39, 20, 20, 90, 90)
          $background.CloseFigure()
          $backgroundBrush = [System.Drawing.SolidBrush]::new([System.Drawing.Color]::FromArgb(255, 18, 20, 29))
          $graphics.FillPath($backgroundBrush, $background)
          $accent = [System.Drawing.Drawing2D.GraphicsPath]::new()
          $accent.AddArc(19, 5, 18, 18, 180, 90)
          $accent.AddArc(27, 5, 18, 18, 270, 90)
          $accent.AddArc(27, 7, 18, 18, 0, 90)
          $accent.AddArc(19, 7, 18, 18, 90, 90)
          $accent.CloseFigure()
          $accentBrush = [System.Drawing.SolidBrush]::new([System.Drawing.Color]::FromArgb(255, 91, 124, 250))
          $graphics.FillPath($accentBrush, $accent)
          $linePen = [System.Drawing.Pen]::new([System.Drawing.Color]::FromArgb(255, 225, 229, 242), 3)
          $graphics.DrawLine($linePen, 22, 39, 42, 39)
          $png = [System.IO.MemoryStream]::new()
          $bitmap.Save($png, [System.Drawing.Imaging.ImageFormat]::Png)
          $file = [System.IO.File]::Create((Join-Path (Get-Location) "src-tauri/icons/icon.ico"))
          $writer = [System.IO.BinaryWriter]::new($file)
          $writer.Write([UInt16]0)
          $writer.Write([UInt16]1)
          $writer.Write([UInt16]1)
          $writer.Write([byte]64)
          $writer.Write([byte]64)
          $writer.Write([byte]0)
          $writer.Write([byte]0)
          $writer.Write([UInt16]1)
          $writer.Write([UInt16]32)
          $writer.Write([UInt32]$png.Length)
          $writer.Write([UInt32]22)
          $writer.Write($png.ToArray())
          $writer.Dispose()
          $png.Dispose()
          $file.Dispose()
          $linePen.Dispose()
          $accentBrush.Dispose()
          $backgroundBrush.Dispose()
          $accent.Dispose()
          $background.Dispose()
          $graphics.Dispose()
          $bitmap.Dispose()
      - name: Configure version and updater key
        shell: pwsh
        env:
          APP_VERSION: ${{ inputs.version }}
          UPDATE_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
        run: |
          if ($env:APP_VERSION -notmatch '^\d+\.\d+\.\d+([+-][0-9A-Za-z.-]+)?$') {
            throw "La version doit suivre le format SemVer, par exemple 0.1.1."
          }
          if ([string]::IsNullOrWhiteSpace($env:UPDATE_PUBLIC_KEY)) {
            throw "Il manque la variable de dépôt TAURI_SIGNING_PUBLIC_KEY."
          }
          $configPath = "src-tauri/tauri.conf.json"
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          $config.version = $env:APP_VERSION
          $config.bundle.createUpdaterArtifacts = $true
          $config.plugins.updater.pubkey = $env:UPDATE_PUBLIC_KEY
          $config | ConvertTo-Json -Depth 100 | Set-Content -Path $configPath -Encoding utf8

      - name: Build and publish signed release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ inputs.version }}
          releaseName: WindowsNotch v${{ inputs.version }}
          releaseBody: "Version ${{ inputs.version }} de WindowsNotch."
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          args: --bundles nsis
