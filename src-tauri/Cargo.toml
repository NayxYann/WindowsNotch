[package]
name = "windowsnotch"
version = "0.1.0"
description = "Une notch légère pour les médias Windows"
authors = ["NayxYann"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.62", features = ["Media_Control"] }

[features]
custom-protocol = ["tauri/custom-protocol"]